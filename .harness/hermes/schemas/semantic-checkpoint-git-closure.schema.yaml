{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Semantic checkpoint Git closure packet",
  "type": "object",
  "required": ["schema", "checkpoint_id", "work_id", "graph_source", "repository", "scoped_paths", "excluded_dirty_paths", "prohibited_actions", "owner_approval", "execution_instruction", "commit_message", "verification_command", "lifecycle_declaration"],
  "properties": {
    "schema": {"const": "harness.cps.semantic-checkpoint-git-closure.v1"},
    "checkpoint_id": {"type": "string", "pattern": "^[^/@]+@r[1-9][0-9]*$"},
    "work_id": {"type": "string", "minLength": 1},
    "graph_source": {
      "type": "object",
      "required": ["ref", "digest", "expected_prior_revision"],
      "properties": {
        "ref": {"type": "string", "minLength": 1},
        "digest": {"type": "string", "pattern": "^[0-9a-f]{64}$"},
        "expected_prior_revision": {"type": ["integer", "null"], "minimum": 1}
      },
      "additionalProperties": false
    },
    "repository": {
      "type": "object",
      "required": ["root", "branch", "upstream"],
      "properties": {
        "root": {"type": "string", "minLength": 1},
        "branch": {"type": "string", "minLength": 1},
        "upstream": {"type": "string", "minLength": 1}
      },
      "additionalProperties": false
    },
    "scoped_paths": {"type": "array", "items": {"type": "string", "minLength": 1}},
    "excluded_dirty_paths": {"type": "array", "items": {"type": "string", "minLength": 1}},
    "lifecycle_declaration": {
      "type": "object",
      "required": ["baseline", "source_mutations", "ephemeral_generated_paths", "persistent_evidence_paths"],
      "properties": {
        "baseline": {
          "type": "object",
          "propertyNames": {"type": "string", "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))(?!.*[\\*?\\[\\]\\\\])[^/]+(?:/[^/]+)*$"},
          "additionalProperties": {"enum": ["present", "absent"]},
          "maxProperties": 128
        },
        "source_mutations": {"$ref": "#/$defs/exact_paths"},
        "ephemeral_generated_paths": {"$ref": "#/$defs/exact_paths"},
        "persistent_evidence_paths": {"$ref": "#/$defs/exact_paths"}
      },
      "additionalProperties": false
    },
    "closure_AC_ref": {"type": "string", "minLength": 1},
    "CPS_refs": {
      "type": "object",
      "required": ["C", "P", "S", "AC", "packet"],
      "properties": {
        "C": {"type": "string", "minLength": 1},
        "P": {"type": "array", "items": {"type": "string"}},
        "S": {"type": "string", "minLength": 1},
        "AC": {"type": "string", "minLength": 1},
        "packet": {"type": "string", "minLength": 1}
      },
      "additionalProperties": false
    },
    "prohibited_actions": {"type": "array", "items": {"type": "string", "minLength": 1}},
    "owner_approval": {"const": true},
    "execution_instruction": {"const": "Perform only the scoped Git closure described by this packet: remove only exact lifecycle_declaration.ephemeral_generated_paths that baseline marks absent, never directories or recursive sweeps; preserve source_mutations, persistent_evidence_paths, pre-existing, ambiguous, and unrelated paths; run verification_command if present; stage only scoped_paths; create the exact commit_message; push only repository.branch to repository.upstream; then report bounded cleanup facts."},
    "commit_message": {"type": "string", "minLength": 1},
    "verification_command": {"type": ["string", "null"]}
  },
  "additionalProperties": false,
  "$defs": {
    "exact_paths": {
      "type": "array",
      "maxItems": 128,
      "uniqueItems": true,
      "items": {"type": "string", "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))(?!.*[\\*?\\[\\]\\\\])[^/]+(?:/[^/]+)*$"}
    }
  }
}

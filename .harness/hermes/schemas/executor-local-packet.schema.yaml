{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "title": "Executor local selected-ref projection",
  "type": "object",
  "required": ["family", "work_id", "graph_ref", "local_nodes", "local_edges", "source_refs", "task_AC", "evidence_requirements", "allowed_write_refs", "must_preserve", "forbidden_effects"],
  "properties": {
    "family": {"const": "executor_local_packet"},
    "work_id": {"type": "string", "minLength": 1},
    "graph_ref": {"type": "string", "minLength": 1},
    "local_nodes": {"type": "array", "minItems": 1, "items": {}},
    "local_edges": {"type": "array", "items": {}},
    "source_refs": {"type": "array", "minItems": 1, "items": {}},
    "task_AC": {"type": "array", "minItems": 1, "items": {}},
    "evidence_requirements": {"type": "array", "minItems": 1, "items": {}},
    "allowed_write_refs": {"$ref": "#/$defs/repository_relative_posix_paths"},
    "must_preserve": {"$ref": "#/$defs/bounded_unique_values"},
    "forbidden_effects": {"$ref": "#/$defs/bounded_unique_values"}
  },
  "additionalProperties": false,
  "$defs": {
    "bounded_unique_values": {
      "type": "array",
      "minItems": 1,
      "maxItems": 128,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1, "maxLength": 2048}
    },
    "repository_relative_posix_paths": {
      "type": "array",
      "minItems": 1,
      "maxItems": 128,
      "uniqueItems": true,
      "items": {
        "type": "string",
        "minLength": 1,
        "maxLength": 1024,
        "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\\\)(?!.*[:*?\\[\\]]).+$"
      }
    }
  }
}

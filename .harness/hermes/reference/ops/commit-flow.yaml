version: 1
schema: harness-hermes-commit-flow-contract
purpose: Distilled commit and push handoff contract for Hermes.
binding_policy:
  do_not_import: true
  run_only_when_target_project_has_harness_core: true
ownership_boundary:
  harness_owns: [precheck criteria, review evidence criteria, commit and push handoff criteria, done gate criteria]
  hermes_owns: [Kanban done or blocked transition, task audit comment, worker lifecycle]
  gateway_owns: [who is allowed to request commit or push through a channel]
pipeline:
  - step: cleanup
    behavior: Remove only exact declared ephemeral_generated_paths proven absent by the declared baseline; never remove directories or sweep recursively. Preserve persistent evidence, pre-existing, ambiguous, and unrelated paths.
  - step: stage
    behavior: stage only intended task files.
  - step: precheck
    behavior: run harness pre-commit check, py_compile for staged Python, shell syntax for staged shell, docs checks, and secret scan.
  - step: review
    behavior: run only when requested or security gate requires it.
  - step: handoff
    behavior: report commit and push commands as owner-actions unless explicitly approved.
default_commands:
  - harness precheck
approval_commands:
  - git commit
  - git push
  - docs_ops.py move
  - docs_ops.py wip-sync
done_gate:
  requires: [precheck pass, no line-confirmed secret, WIP lifecycle resolved, requested tests recorded, independent filesystem and git check-ignore readback proves every declared ephemeral path absent, every declared persistent evidence path exists, bounded cleanup observations recorded]
  refuses: [direct commit from Hermes wrapper, direct push from Hermes wrapper, unapproved state-changing docs op]
cleanup_lifecycle:
  declaration_required: [baseline, source_mutations, ephemeral_generated_paths, persistent_evidence_paths]
  path_policy: exact repo-relative paths only; reject absolute paths, parent traversal, symlinks, normalization ambiguity, globs, duplicates, and cross-class paths.
  failure_status: git_failed
  semantic_verdict_on_failure: forbidden
  dispatcher_artifacts: [job record, packet, stdout log, stderr log]
  dispatcher_artifact_class: persistent evidence
